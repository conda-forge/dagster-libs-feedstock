        - pip
        - python ${{ python_min }}.*
      run:
        - ${{ dagster }}
        - boto3
        - packaging
        - python >=${{ python_min }}
        - requests
    tests:
      - package_contents:
          strict: true
          site_packages:
            - dagster_aws/**
            - dagster_aws-${{ version }}.dist-info/**
      - python:
          imports:
            - dagster_aws
          pip_check: true
          python_version:
